<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <title>Formulario de Solicitud • PaperEase</title>
  <script src="js/authHelper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!isAuthenticated()) {
        window.location.href = 'Login.html';
      }
    });
  </script>
</head>
<body>
<!-- Header -->
 <header>
 <div class="container">
 <div class="logo-container">
 <img src="imagenes/logo.png" alt="PaperEase Logo" class="logo" />
 <span class="logo-text">PaperEase</span>
 </div>
 </div>
 </header>

<!-- Contenido principal -->
 <main>
 <section class="form-section">
 <div class="container">
 <h2>Formulario de Solicitud</h2>
 <p>Completa los campos con tus datos personales y elige el programa de Bienestar Estudiantil que deseas solicitar.</p>

<form id="formulario" method="POST" enctype="multipart/form-data" class="formulario">
  
  <!-- ⭐ Campo de cédula OCULTO - se llena automáticamente desde la sesión -->
  <input type="hidden" id="cedula" name="cedula" />
  
  <div class="form-group">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required />
  </div>
  
  <div class="form-group">
    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" name="apellido" required />
  </div>
  
  <div class="form-group genero-radio-group">
    <label>Género</label>
    <div class="form-radio-group">
      <label class="form-radio">
        <input type="radio" name="genero" value="1" required />
        Masculino
      </label>
      <label class="form-radio">
        <input type="radio" name="genero" value="2" />
        Femenino
      </label>
    </div>
  </div>
  
  <div class="form-group">
    <label for="facultad">Facultad</label>
    <select id="facultad" name="facultad" required>
      <option value="">Seleccione una facultad</option>
      <option value="1">Civil</option>
      <option value="5">CyT</option>
      <option value="6">Eléctrica</option>
      <option value="2">Industrial</option>
      <option value="3">Mecánica</option>
      <option value="4">Sistema</option>
    </select>
  </div>

  <div class="form-group">
    <label for="tipoPrograma">Tipo de Programa</label>
    <select id="tipoPrograma" name="tipoPrograma" required>
      <option value="">Seleccione un tipo</option>
      <option value="1">Promoción Social</option>
      <option value="2">Salud</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="programa">Programa a Solicitar</label>
    <select id="programa" name="programa" required>
      <option value="">Seleccione una opción</option>
      <optgroup label="Promoción Social">
        <option value="1" data-tipo="1">Canasta Navideña</option>
        <option value="2" data-tipo="1">Campaña de Fortalecimiento de Valores</option>
        <option value="3" data-tipo="1">Campaña de Concienciación de Instalaciones</option>
        <option value="4" data-tipo="1">Feria de Empleo</option>
        <option value="5" data-tipo="1">Consejería Personal</option>
      </optgroup>
      <optgroup label="Salud">
        <option value="6" data-tipo="2">Banco de Sangre</option>
        <option value="7" data-tipo="2">Ayuda en Gastos Médicos</option>
        <option value="8" data-tipo="2">Feria de Salud</option>
        <option value="9" data-tipo="2">Compra de Lentes</option>
        <option value="10" data-tipo="2">Apoyo en medicamentos</option>
        <option value="11" data-tipo="2">Póliza de Salud</option>
      </optgroup>
    </select>
  </div>
  
  <div class="form-group">
    <label for="archivo">Adjuntar Archivos (PDF, JPG, PNG)</label>
    <input type="file" id="archivo" name="archivo" accept=".pdf,.jpg,.jpeg,.png" />
  </div>
  
  <div class="cta-section">
     <button type="submit" class="cta-primary">Enviar Solicitud</button>
     <button type="button" onclick="window.location.href='Programas.html'" class="cta-secondary">Cancelar</button>
  </div>
 
</form>

<!-- Mensajes de estado -->
<div id="message" style="display: none; padding: 15px; margin: 20px 0; border-radius: 5px;"></div>
<div id="loading" style="display: none; text-align: center; padding: 20px;"></div>
 </div>
 </section>
 </main>

<!-- Footer -->
 <footer>
 <div class="footer-flex container">
 <p>© 2025 PaperEase • Universidad Tecnológica de Panamá</p>
 <div class="footer-links">
 <a href="Ayuda.html">Ayuda</a>
 <a href="Privacidad.html">Privacidad</a>
 <a href="Terminos.html">Términos</a>
 </div>
 </div>
 </footer>

<script src="js/authHelper.js"></script>
<script>
const API_BASE = window.location.origin;

document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.formulario');
    const messageDiv = document.getElementById('message');
    const loadingDiv = document.getElementById('loading');

    // ⭐⭐⭐ OBTENER LOS DATOS DEL USUARIO DESDE EL NUEVO ENDPOINT ⭐⭐⭐
    async function cargarDatosSesion() {
        try {
            console.log('🔍 Obteniendo datos del usuario autenticado...');

            // Obtener el token de autenticación
            const token = getAuthToken();

            if (!token) {
                console.warn('⚠️ No hay token de autenticación');
                showMessage('⚠️ Debes iniciar sesión para hacer una solicitud', true);
                setTimeout(() => {
                    window.location.href = 'Login.html';
                }, 2000);
                return;
            }

            // Llamar al nuevo endpoint /api/auth/me
            const response = await fetch(`${API_BASE}/api/auth/me`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();

            if (data.autenticado && data.Cedula) {
                console.log('✅ Datos del usuario obtenidos:', data);

                // ⭐ Llenar el campo oculto de cédula
                document.getElementById('cedula').value = data.Cedula;

                // Prellenar otros campos automáticamente
                if (data.Nombre) {
                    document.getElementById('nombre').value = data.Nombre;
                    document.getElementById('nombre').setAttribute('readonly', true);
                }
                if (data.Apellido) {
                    document.getElementById('apellido').value = data.Apellido;
                    document.getElementById('apellido').setAttribute('readonly', true);
                }
                if (data.IdGenero) {
                    const radioGenero = document.querySelector(`input[name="genero"][value="${data.IdGenero}"]`);
                    if (radioGenero) {
                        radioGenero.checked = true;
                        // Hacer readonly todos los radios de género
                        document.querySelectorAll('input[name="genero"]').forEach(radio => {
                            radio.setAttribute('disabled', true);
                        });
                    }
                }
                if (data.IdFacultad) {
                    document.getElementById('facultad').value = data.IdFacultad;
                    document.getElementById('facultad').setAttribute('disabled', true);
                }

                console.log('✅ Campos del formulario prellenados con datos del usuario');

            } else {
                console.warn('⚠️ Usuario no autenticado o sin datos completos');
                showMessage('⚠️ Debes iniciar sesión para hacer una solicitud', true);
                setTimeout(() => {
                    window.location.href = 'Login.html';
                }, 2000);
            }

        } catch (error) {
            console.error('❌ Error al obtener datos del usuario:', error);
            showMessage('❌ Error al verificar sesión. Por favor, inicia sesión nuevamente.', true);

            setTimeout(() => {
                window.location.href = 'Login.html';
            }, 2000);
        }
    }

    // ⭐ Llamar a la función al cargar la página
    cargarDatosSesion();

    // Leer parámetros de la URL para preseleccionar programa
    const urlParams = new URLSearchParams(window.location.search);
    const tipoParam = urlParams.get('tipo');
    const programaParam = urlParams.get('programa');

    if (tipoParam) {
        const tipoProgramaSelect = document.getElementById('tipoPrograma');
        tipoProgramaSelect.value = tipoParam;
        tipoProgramaSelect.setAttribute('data-preselected', 'true');
        tipoProgramaSelect.dispatchEvent(new Event('change'));
    }

    if (programaParam) {
        setTimeout(() => {
            const programaSelect = document.getElementById('programa');
            programaSelect.value = programaParam;
            programaSelect.setAttribute('data-preselected', 'true');
        }, 100);
    }

    // Función para mostrar mensajes
    function showMessage(message, isError = false) {
        messageDiv.style.display = 'block';
        messageDiv.textContent = message;
        messageDiv.style.backgroundColor = isError ? '#fee2e2' : '#dcfce7';
        messageDiv.style.color = isError ? '#dc2626' : '#16a34a';
        messageDiv.style.border = isError ? '1px solid #fca5a5' : '1px solid #86efac';
        messageDiv.classList.add('success-animation');
        
        setTimeout(() => {
            messageDiv.classList.remove('success-animation');
        }, 500);
    }
    
    // Función para mostrar/ocultar loading
    function showLoading(show) {
        loadingDiv.style.display = show ? 'block' : 'none';
        loadingDiv.textContent = show ? '📤 Enviando solicitud...' : '';
    }
  
    // ⭐ ENVÍO DEL FORMULARIO CON CÉDULA AUTOMÁTICA
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        messageDiv.style.display = 'none';
        
        // ⭐ Verificar que la cédula esté presente
        const cedula = document.getElementById('cedula').value;
        
        if (!cedula) {
            showMessage('❌ Error: No se pudo obtener tu cédula. Por favor, inicia sesión nuevamente.', true);
            return;
        }
        
        console.log('📋 Cédula a enviar:', cedula);
        
        showLoading(true);

        const formData = new FormData(form);

        // Habilitar campos deshabilitados temporalmente para que se envíen
        const facultadSelect = document.getElementById('facultad');
        const wasDisabled = facultadSelect.disabled;
        if (wasDisabled) {
            facultadSelect.disabled = false;
            formData.set('facultad', facultadSelect.value);
        }

        // Verificar que la cédula esté en el FormData
        console.log('📤 Datos del formulario:');
        for (let [key, value] of formData.entries()) {
            console.log(`   ${key}: ${value}`);
        }

        // Restaurar estado disabled
        if (wasDisabled) {
            facultadSelect.disabled = true;
        }

        fetch(`${API_BASE}/api/formulario`, {
            method: 'POST',
            body: formData,
            credentials: 'include' // Importante para mantener sesión
        })
        .then(response => response.json())
        .then(data => {
            showLoading(false);

            if (data.success) {
                showMessage(`✅ ¡Solicitud registrada exitosamente!
                             📝 ID: ${data.id}`, false);
                
                // Limpiar el formulario EXCEPTO la cédula (que está oculta)
                form.reset();
                
                // Re-llenar la cédula después del reset
                document.getElementById('cedula').value = cedula;
                
                messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // ⭐ REDIRIGIR A LA PÁGINA DE INICIO DESPUÉS DE 2 SEGUNDOS ⭐
                setTimeout(() => {
                    window.location.href = 'MenuPE.html';
                }, 2000);
            } else {
                showMessage(`❌ ${data.error || 'Ocurrió un error inesperado.'}`, true);
            }
        })
        .catch(error => {
            showLoading(false);
            showMessage('❌ Error al enviar la solicitud. Intenta nuevamente.', true);
            console.error('❌ Error en la petición:', error);
        });
    });

    // Funcionalidad para actualizar el select de programas según el tipo
    const tipoProgramaSelect = document.getElementById('tipoPrograma');
    const programaSelect = document.getElementById('programa');
    
    tipoProgramaSelect.addEventListener('change', function() {
        const tipoSeleccionado = this.value;
        const opciones = programaSelect.querySelectorAll('option');
        
        programaSelect.value = '';
        
        opciones.forEach(option => {
            if (option.value === '') {
                option.style.display = 'block';
            } else {
                const tipoOpcion = option.getAttribute('data-tipo');
                if (tipoOpcion === tipoSeleccionado || !tipoSeleccionado) {
                    option.style.display = 'block';
                } else {
                    option.style.display = 'none';
                }
            }
        });
    });
});
</script>
</body>
</html>
