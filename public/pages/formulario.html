<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <title>Formulario de Solicitud &bull; PaperEase</title>
  <script src="/js/core/auth-helper.js"></script>
  <style>
    .solicitud-meta {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .solicitud-meta .meta-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4D869C;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .solicitud-meta .meta-title {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    .solicitud-meta .meta-user {
      font-size: 13px;
      color: #6b7280;
      margin: 0;
    }
    .solicitud-meta .meta-user strong {
      color: #374151;
      font-weight: 600;
    }
    .solicitud-meta .meta-note {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f3f4f6;
    }
    .error-missing-params {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin: 20px 0;
    }
    .error-missing-params h3 {
      color: #dc2626;
      margin-bottom: 8px;
    }
    .error-missing-params p {
      color: #6b7280;
      margin-bottom: 16px;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
      }
    });
  </script>
</head>
<body>
<!-- Header -->
 <header>
 <div class="container">
 <a href="menupe.html" class="logo-container" style="text-decoration: none;">
 <img src="/imagenes/logo.png" alt="PaperEase Logo" class="logo" width="40" height="40" />
 <span class="logo-text">PaperEase</span>
 </a>
 </div>
 </header>

<!-- Contenido principal -->
 <main>
 <section class="form-section">
 <div class="container">
  <h2>Formulario de Solicitud</h2>

  <div id="bannerPrograma" style="display:none;"></div>
  <div id="missingParams" style="display:none;"></div>

<form id="formulario" method="POST" enctype="multipart/form-data" class="formulario">

  <input type="hidden" id="tipoProgramaHidden" name="tipoPrograma" />
  <input type="hidden" id="programaHidden" name="programa" />

  <div class="form-group">
    <label for="archivo">Adjuntar Archivos (PDF, JPG, PNG)</label>
    <input type="file" id="archivo" name="archivo" accept=".pdf,.jpg,.jpeg,.png" />
  </div>

  <div class="cta-section">
     <button type="submit" class="cta-primary" id="btnEnviar" disabled>Enviar Solicitud</button>
     <button type="button" id="btnCancelar" class="cta-secondary">Cancelar</button>
  </div>

</form>

<!-- Mensajes de estado -->
<div id="message" style="display: none; padding: 15px; margin: 20px 0; border-radius: 5px;"></div>
<div id="loading" style="display: none; text-align: center; padding: 20px;"></div>
 </div>
 </section>
 </main>

<!-- Footer -->
 <footer>
 <div class="footer-flex container">
 <p>&copy; 2025 PaperEase &bull; Universidad Tecnol&oacute;gica de Panam&aacute;</p>
 <div class="footer-links">
 <a href="ayuda.html">Ayuda</a>
 <a href="privacidad.html">Privacidad</a>
 <a href="terminos.html">T&eacute;rminos</a>
 </div>
 </div>
 </footer>

<script src="/js/core/auth-helper.js"></script>
<script src="/js/pages/formulario.js"></script>
<script>
const API_BASE = window.location.origin;

document.addEventListener('DOMContentLoaded', async function() {
    if (window.PaperEaseFormularioManaged) return;
    const form = document.querySelector('.formulario');
    const messageDiv = document.getElementById('message');
    const loadingDiv = document.getElementById('loading');
    const btnEnviar = document.getElementById('btnEnviar');
    const missingParamsDiv = document.getElementById('missingParams');

    const urlParams = new URLSearchParams(window.location.search);
    const tipoParam = urlParams.get('tipo');
    const programaParam = urlParams.get('programa');

    const tipoHidden = document.getElementById('tipoProgramaHidden');
    const programaHidden = document.getElementById('programaHidden');

    function showMessage(message, isError = false) {
        messageDiv.style.display = 'block';
        messageDiv.textContent = message;
        messageDiv.style.backgroundColor = isError ? '#fee2e2' : '#dcfce7';
        messageDiv.style.color = isError ? '#dc2626' : '#16a34a';
        messageDiv.style.border = isError ? '1px solid #fca5a5' : '1px solid #86efac';
        messageDiv.classList.add('success-animation');
        setTimeout(() => messageDiv.classList.remove('success-animation'), 500);
    }

    function showLoading(show) {
        loadingDiv.style.display = show ? 'block' : 'none';
        loadingDiv.textContent = show ? 'Enviando solicitud...' : '';
    }

    function showMissingParams() {
        missingParamsDiv.style.display = 'block';
        missingParamsDiv.innerHTML = `
          <div class="error-missing-params">
            <h3>Debes seleccionar un programa primero</h3>
            <p>Para hacer una solicitud, elige un programa desde la p&aacute;gina de Programas.</p>
            <a href="programas.html" class="cta-primary" style="display:inline-block; text-decoration:none; padding:10px 24px; background:#4D869C; color:white; border-radius:6px;">Ver Programas</a>
          </div>`;
        btnEnviar.disabled = true;
    }

    async function loadUserProfile() {
        try {
            const token = getAuthToken();
            if (!token) {
                showMessage('Debes iniciar sesi&oacute;n para hacer una solicitud', true);
                setTimeout(() => window.location.href = 'login.html', 2000);
                return null;
            }

            const response = await fetch(`${API_BASE}/api/auth/me`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();
            if (!data.autenticado) {
                showMessage('Debes iniciar sesi&oacute;n para hacer una solicitud', true);
                setTimeout(() => window.location.href = 'login.html', 2000);
                return null;
            }

            return data;
        } catch (error) {
            console.error('Error al obtener datos del usuario:', error);
            showMessage('Error al verificar sesi&oacute;n. Por favor, inicia sesi&oacute;n nuevamente.', true);
            setTimeout(() => window.location.href = 'login.html', 2000);
            return null;
        }
    }

    if (!tipoParam || !programaParam) {
        showMissingParams();
        await loadUserProfile();
        return;
    }

    const tipoProgramaId = parseInt(tipoParam);
    const programaId = parseInt(programaParam);

    if (isNaN(tipoProgramaId) || isNaN(programaId) || tipoProgramaId < 1 || tipoProgramaId > 2 || programaId < 1 || programaId > 13) {
        showMissingParams();
        await loadUserProfile();
        return;
    }

    tipoHidden.value = tipoParam;
    programaHidden.value = programaParam;
    btnEnviar.disabled = false;

    const mapProgramaNombre = {
      '1':'Consejer&iacute;a Personal','2':'Banco de Sangre','3':'Ayuda en Gastos M&eacute;dicos',
      '4':'Feria de Salud','5':'Compra de Lentes','6':'Apoyo en Medicamento',
      '7':'P&oacute;liza de Salud','8':'Matr&iacute;cula','9':'Canasta Navide&ntilde;a',
      '10':'Campa&ntilde;a de Fortalecimiento de Valores','11':'Campa&ntilde;a de Concienciaci&oacute;n de Instalaciones',
      '12':'Feria de Empleo','13':'Apoyo en Casos de Siniestros'
    };
    const mapTipoNombre = { '1':'Salud', '2':'Promoci&oacute;n Social' };

    const nombrePrograma = mapProgramaNombre[programaParam] || 'Programa';
    const nombreTipo = mapTipoNombre[tipoParam] || '';

    const userData = await loadUserProfile();
    const userName = userData ? `${userData.Nombre || userData.nombre || ''} ${userData.Apellido || userData.apellido || ''}`.trim() : '';

    const bannerDiv = document.getElementById('bannerPrograma');
    bannerDiv.style.display = 'block';
    bannerDiv.innerHTML = `
      <div class="solicitud-meta">
        <span class="meta-badge">${nombreTipo}</span>
        <h3 class="meta-title">${nombrePrograma}</h3>
        ${userName ? `<p class="meta-user">Solicitando como: <strong>${userName}</strong></p>` : ''}
        <p class="meta-note">Esta selecci&oacute;n no se puede cambiar en este paso. Si necesitas modificarla, cancela y vuelve a seleccionar desde la p&aacute;gina de Programas.</p>
      </div>`;

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        messageDiv.style.display = 'none';

        const token = getAuthToken();
        if (!token) {
            showMessage('Debes iniciar sesi&oacute;n para enviar esta solicitud', true);
            return;
        }

        showLoading(true);

        const formData = new FormData();
        formData.set('tipoPrograma', tipoHidden.value);
        formData.set('programa', programaHidden.value);

        const fileInput = document.getElementById('archivo');
        if (fileInput.files.length > 0) {
            formData.set('archivo', fileInput.files[0]);
        }

        try {
            const response = await fetch(`${API_BASE}/api/formulario`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            const data = await response.json();
            showLoading(false);

            if (response.ok && data.success) {
                showMessage(`Solicitud registrada exitosamente! ID: ${data.id}`, false);
                form.reset();
                messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => window.location.href = 'solicitudes.html', 2000);
            } else {
                showMessage(`${data.error || 'Ocurri&oacute; un error inesperado.'}`, true);
            }
        } catch (error) {
            showLoading(false);
            showMessage('Error al enviar la solicitud. Intenta nuevamente.', true);
            console.error('Error en la petici&oacute;n:', error);
        }
    });
});
</script>
</body>
</html>
